[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoy"
version = "1.0.0"
description = "Autonomous news-to-video pipeline: NewsScout → TTS → ffmpeg render → YouTube Shorts / weekly digest, controlled from Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kuanysh" }]
keywords = ["youtube", "shorts", "automation", "tts", "ffmpeg", "telegram", "news"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "edge-tts>=7.0",
    "gTTS>=2.5",
    "Pillow>=10.0",
    "requests>=2.31",
    "httpx>=0.27",
    "schedule>=1.2",
    "python-telegram-bot>=20.4",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1",
]

[project.optional-dependencies]
newsscout = ["newsscout @ git+https://github.com/kuanysh228/NewsScout.git"]
piper = ["piper-tts"]
silero = ["torch", "numpy"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
autoy = "autoy.cli:main"

[project.urls]
Homepage = "https://github.com/kuanysh228/autoy"
Repository = "https://github.com/kuanysh228/autoy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["autoy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

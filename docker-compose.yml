# Before the first start (see README, "Docker"): create .env, put client_secret.json and the
# generated OAuth tokens in ./credentials, and run `mkdir -p credentials output`.
x-autoy: &autoy
  build: .
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./credentials:/app/credentials
    - ./output:/app/output
    - data:/app/data
    - cache:/app/cache
    # - ./channels.toml:/app/channels.toml:ro   # create the file first (see channels.example.toml)

services:
  bot:
    <<: *autoy
    command: ["bot"]

  scheduler:
    <<: *autoy
    command: ["scheduler", "world"]

volumes:
  data:
  cache:

name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove tokens, keys and chat IDs first.
      render: shell
  - type: input
    id: version
    attributes:
      label: autoy version
      description: Output of `autoy --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, ffmpeg version, TTS backend
    validations:
      required: true
